
name: Build SimpleBot Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl python3

      - name: Download SimpleBot source
        uses: actions/checkout@v4
        with:
          repository: ReSpeak/SimpleBot
          path: simplebot-src

      - name: Download tsclientlib source
        uses: actions/checkout@v4
        with:
          repository: ReSpeak/tsclientlib
          path: tsclientlib-src
          submodules: recursive

      - name: Enable vendored OpenSSL
        working-directory: simplebot-src
        run: |
          echo 'openssl-sys = { version = "0.9", features = ["vendored"] }' >> Cargo.toml

      - name: Apply TeaSpeak fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("tsclientlib-src/utils/ts-bookkeeping/build/message_parser.rs")
          s = p.read_text()

          start = s.index('\t\t"OffsetDateTime" => format!(')
          end = s.index('\n\t\t_ => panic!', start)

          new_arm = """\t\t"OffsetDateTime" => {
          \t\t\tif field.ts == "timestamp" {
          \t\t\t\tformat!(
          \t\t\t\t\t"OffsetDateTime::from_unix_timestamp({{
          \t\t\t\t\t\tlet timestamp = val.parse::<i64>().map_err(|e| ParseError::ParseInt {{
          \t\t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\t\tsource: e,
          \t\t\t\t\t\t}})?;
          \t\t\t\t\t\tif timestamp > 253_402_300_799 || timestamp < -377_705_116_800 {{
          \t\t\t\t\t\t\ttimestamp / 1000
          \t\t\t\t\t\t}} else {{
          \t\t\t\t\t\t\ttimestamp
          \t\t\t\t\t\t}}
          \t\t\t\t\t}}).map_err(|e| ParseError::ParseDate {{
          \t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\tsource: e,
          \t\t\t\t\t}})?",
          \t\t\t\t\tfield.pretty, field.pretty
          \t\t\t\t)
          \t\t\t} else {
          \t\t\t\tformat!(
          \t\t\t\t\t"OffsetDateTime::from_unix_timestamp(
          \t\t\t\t\t\tval.parse().map_err(|e| ParseError::ParseInt {{
          \t\t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\t\tsource: e,
          \t\t\t\t\t\t}})?).map_err(|e| ParseError::ParseDate {{
          \t\t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\t\tsource: e,
          \t\t\t\t\t\t}})?",
          \t\t\t\t\tfield.pretty, field.pretty
          \t\t\t\t)
          \t\t\t}
          \t\t},"""

          s = s[:start] + new_arm + s[end:]
          p.write_text(s)

          p = Path("simplebot-src/src/main.rs")
          s = p.read_text()

          old = "let identity = Identity::new(private_key, 0);"
          new = "let mut identity = Identity::new(private_key, 0);\n\tidentity.upgrade_level(8);"

          if old not in s:
              raise SystemExit("Identity line not found")
          s = s.replace(old, new, 1)

          old = "tracing_subscriber::fmt::init();"
          new = 'tracing_subscriber::fmt().with_env_filter("debug").init();'

          if old not in s:
              raise SystemExit("Log initialization line not found")
          s = s.replace(old, new, 1)

          old = "state.send_message(*target, response.as_ref()).send(con)"
          new = """{
              let reply_target = match target {
                  MessageTarget::Client(_) => MessageTarget::Client(invoker.id),
                  _ => *target,
              };
              state.send_message(reply_target, response.as_ref()).send(con)
          }"""

          if old not in s:
              raise SystemExit("Reply target line not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("simplebot-src/Cargo.toml")
          s = p.read_text()
          s += '''

          [patch."https://github.com/ReSpeak/tsclientlib"]
          tsclientlib = { path = "../tsclientlib-src/tsclientlib" }
          tsproto-types = { path = "../tsclientlib-src/utils/tsproto-types" }
          '''
          p.write_text(s)
          PY

      - name: Add Gemini AI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("simplebot-src/Cargo.toml")
          s = cargo.read_text()

          old = 'tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }\n'
          new = old + 'reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }\nserde_json = "1"\n'

          if s.count(old) != 1:
              raise SystemExit("Cargo dependency location not found")

          cargo.write_text(s.replace(old, new, 1))

          p = Path("simplebot-src/src/main.rs")
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f"Could not uniquely find {label}")
              s = s.replace(old, new, 1)

          replace_once(
              "use std::cell::Cell;\n",
              "use std::cell::Cell;\nuse std::collections::HashMap;\n",
              "imports"
          )

          replace_once(
              "use serde::{Deserialize, Serialize};\n",
              "use serde::{Deserialize, Serialize};\nuse serde_json::{json, Value};\n",
              "serde imports"
          )

          replace_once(
              "should_reload: Cell<bool>,\n",
              "should_reload: Cell<bool>,\nai_history: HashMap<String, Vec<(String, String)>>,\n",
              "history field"
          )

          replace_once(
              "should_reload: Default::default(),\n",
              "should_reload: Default::default(),\nai_history: Default::default(),\n",
              "history initializer"
          )

          start = s.index("fn handle_event(")
          end = s.index("\nfn escape_bb", start)

          new_code = r'''
          const GEMINI_API_KEY: &str = "AQ.Ab8RN6JJTJ8c5qc0vj_jIQdPE8AlkvEzYVkmySDfdMbMoE7FMw";

          fn handle_event(bot: &mut Bot, con: &mut Connection, event: &[Event]) {
              for e in event {
                  if let Event::Message { target, invoker, message } = e {
                      if invoker.id == con.get_state().unwrap().own_client {
                          continue;
                      }

                      debug!(
                          user_id = ?invoker.id,
                          message_chars = message.to_string().chars().count(),
                          "Incoming TeaSpeak message"
                      );

                      {
                          let now = Instant::now();
                          bot.rate_limiting.retain(|i| {
                              now.duration_since(*i) <= Duration::from_secs(1)
                          });

                          if bot.rate_limiting.len() >= bot.settings.rate_limit as usize {
                              continue;
                          }
                      }

                      let msg = Message {
                          target: *target,
                          invoker: invoker.as_ref(),
                          message,
                      };

                      // Existing actions have priority.
                      if let Some(response) = bot.actions.handle(bot, con, &msg) {
                          let state = con.get_state().unwrap();
                          let reply_target = match target {
                              MessageTarget::Client(_) => MessageTarget::Client(invoker.id),
                              _ => *target,
                          };

                          if let Err(error) =
                              state.send_message(reply_target, response.as_ref()).send(con)
                          {
                              error!(%error, "Failed to send action response");
                          }

                          bot.rate_limiting.push(Instant::now());
                          continue;
                      }

                      let history_key = format!("{:?}", invoker.id);
                      let history = bot.ai_history
                          .get(&history_key)
                          .cloned()
                          .unwrap_or_default();

                      let user_text = message.to_string();

                      let result = std::thread::spawn(move || {
                          gemini_reply(&history, &user_text)
                      }).join();

                      match result {
                          Ok(Ok(answer)) => {
                              let entry = bot.ai_history
                                  .entry(history_key)
                                  .or_default();

                              entry.push((user_text, answer.clone()));

                              if entry.len() > 6 {
                                  entry.remove(0);
                              }

                              let reply_target = match target {
                                  MessageTarget::Client(_) | MessageTarget::Poke(_) =>
                                      MessageTarget::Client(invoker.id),
                                  _ => *target,
                              };

                              let safe_answer = escape_bb(&answer);
                              let state = con.get_state().unwrap();

                              if let Err(error) = state
                                  .send_message(reply_target, safe_answer.as_str())
                                  .send(con)
                              {
                                  error!(%error, "Failed to send Gemini response");
                              }

                              bot.rate_limiting.push(Instant::now());
                          }
                          Ok(Err(error)) => {
                              error!(%error, "Gemini API request failed");
                          }
                          Err(_) => {
                              error!("Gemini worker thread failed");
                          }
                      }
                  }
              }
          }

          fn gemini_reply(
              history: &[(String, String)],
              user_message: &str,
          ) -> anyhow::Result<String> {
              let client = reqwest::blocking::Client::builder()
                  .timeout(Duration::from_secs(25))
                  .build()?;

              let mut contents = Vec::new();

              for (user, assistant) in history {
                  contents.push(json!({
                      "role": "user",
                      "parts": [{"text": user}]
                  }));

                  contents.push(json!({
                      "role": "model",
                      "parts": [{"text": assistant}]
                  }));
              }

              contents.push(json!({
                  "role": "user",
                  "parts": [{"text": user_message}]
              }));

              let body = json!({
                  "system_instruction": {
                      "parts": [{
                          "text": "تو یک دستیار فارسی‌زبان به نام علی‌بات هستی. خودمانی، طبیعی، باهوش و کمی شوخ صحبت کن. پاسخ‌ها را کوتاه و مفید نگه دار و از ایموجی به‌اندازه استفاده کن. اگر جواب را نمی‌دانی صادقانه بگو و اطلاعات جعلی نساز."
                      }]
                  },
                  "contents": contents,
                  "generationConfig": {
                      "maxOutputTokens": 220
                  }
              });

              let response = client
                  .post("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent")
                  .header("x-goog-api-key", GEMINI_API_KEY)
                  .json(&body)
                  .send()?;

              let status = response.status();
              let response_text = response.text()?;

              if !status.is_success() {
                  anyhow::bail!(
                      "Gemini HTTP {}: {}",
                      status,
                      response_text.chars().take(1000).collect::<String>()
                  );
              }

              let data: Value = serde_json::from_str(&response_text)?;

              let parts = data["candidates"][0]["content"]["parts"]
                  .as_array()
                  .ok_or_else(|| anyhow::anyhow!("Gemini returned no text candidate"))?;

              let answer = parts.iter()
                  .filter_map(|part| part.get("text").and_then(Value::as_str))
                  .collect::<Vec<_>>()
                  .join("");

              if answer.trim().is_empty() {
                  anyhow::bail!("Gemini returned an empty response");
              }

              Ok(answer.chars().take(650).collect())
          }
          '''

          s = s[:start] + new_code + s[end:]
          p.write_text(s)

          print("Gemini integration added.")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate dependency lockfile
        working-directory: simplebot-src
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Compile
        working-directory: simplebot-src
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simple-bot-linux-x86_64
          path: simplebot-src/target/release/simple-bot
          if-no-files-found: error
          retention-days: 7

      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SimpleBot
          files: simplebot-src/target/release/simple-bot
          overwrite_files: true
          make_latest: true
