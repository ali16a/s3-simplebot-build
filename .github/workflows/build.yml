
name: Build SimpleBot Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl python3

      - name: Download SimpleBot source
        uses: actions/checkout@v4
        with:
          repository: ReSpeak/SimpleBot
          path: simplebot-src

      - name: Download tsclientlib source with declarations
        uses: actions/checkout@v4
        with:
          repository: ReSpeak/tsclientlib
          path: tsclientlib-src
          submodules: recursive

      - name: Enable vendored OpenSSL
        working-directory: simplebot-src
        run: |
          echo 'openssl-sys = { version = "0.9", features = ["vendored"] }' >> Cargo.toml

      - name: Apply TeaSpeak protocol and bot fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("tsclientlib-src/utils/ts-bookkeeping/build/message_parser.rs")
          s = p.read_text()

          start = s.index('\t\t"OffsetDateTime" => format!(')
          end = s.index('\n\t\t_ => panic!', start)

          new_arm = """\t\t"OffsetDateTime" => {
          \t\t\tif field.ts == "timestamp" {
          \t\t\t\tformat!(
          \t\t\t\t\t"OffsetDateTime::from_unix_timestamp({{
          \t\t\t\t\t\tlet timestamp = val.parse::<i64>().map_err(|e| ParseError::ParseInt {{
          \t\t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\t\tsource: e,
          \t\t\t\t\t\t}})?;
          \t\t\t\t\t\tif timestamp > 253_402_300_799 || timestamp < -377_705_116_800 {{
          \t\t\t\t\t\t\ttimestamp / 1000
          \t\t\t\t\t\t}} else {{
          \t\t\t\t\t\t\ttimestamp
          \t\t\t\t\t\t}}
          \t\t\t\t\t}}).map_err(|e| ParseError::ParseDate {{
          \t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\tsource: e,
          \t\t\t\t\t}})?",
          \t\t\t\t\tfield.pretty, field.pretty
          \t\t\t\t)
          \t\t\t} else {
          \t\t\t\tformat!(
          \t\t\t\t\t"OffsetDateTime::from_unix_timestamp(
          \t\t\t\t\t\tval.parse().map_err(|e| ParseError::ParseInt {{
          \t\t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\t\tsource: e,
          \t\t\t\t\t\t}})?).map_err(|e| ParseError::ParseDate {{
          \t\t\t\t\t\t\targ: \\"{}\\",
          \t\t\t\t\t\t\tvalue: val.to_string(),
          \t\t\t\t\t\t\tsource: e,
          \t\t\t\t\t\t}})?",
          \t\t\t\t\tfield.pretty, field.pretty
          \t\t\t\t)
          \t\t\t}
          \t\t},"""

          s = s[:start] + new_arm + s[end:]
          p.write_text(s)

          p = Path("simplebot-src/src/main.rs")
          s = p.read_text()

          old_identity = "let identity = Identity::new(private_key, 0);"
          new_identity = "let mut identity = Identity::new(private_key, 0);\n\tidentity.upgrade_level(8);"

          if old_identity not in s:
              raise SystemExit("Identity line not found")

          s = s.replace(old_identity, new_identity, 1)

          old_log = "tracing_subscriber::fmt::init();"
          new_log = 'tracing_subscriber::fmt().with_env_filter("debug").init();'

          if old_log not in s:
              raise SystemExit("Log initialization line not found")

          s = s.replace(old_log, new_log, 1)

          old_reply = "state.send_message(*target, response.as_ref()).send(con)"

          new_reply = """{
              let reply_target = match target {
                  MessageTarget::Client(_) => MessageTarget::Client(invoker.id),
                  _ => *target,
              };
              state.send_message(reply_target, response.as_ref()).send(con)
          }"""

          if old_reply not in s:
              raise SystemExit("Reply target line not found")

          s = s.replace(old_reply, new_reply, 1)
          p.write_text(s)

          p = Path("simplebot-src/Cargo.toml")
          manifest = p.read_text()

          manifest += '''

          [patch."https://github.com/ReSpeak/tsclientlib"]
          tsclientlib = { path = "../tsclientlib-src/tsclientlib" }
          tsproto-types = { path = "../tsclientlib-src/utils/tsproto-types" }
          '''

          p.write_text(manifest)
          PY

      - name: Add Gemini AI with diagnostics and memory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              if s.count(old) != 1:
                  raise SystemExit(f"Could not uniquely find: {label}")
              return s.replace(old, new, 1)

          cargo = Path("simplebot-src/Cargo.toml")
          s = cargo.read_text()

          s = replace_once(
              s,
              'tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }\n',
              'tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }\n'
              'reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }\n'
              'serde_json = "1"\n',
              "Cargo dependencies"
          )

          cargo.write_text(s)

          p = Path("simplebot-src/src/main.rs")
          s = p.read_text()

          s = replace_once(
              s,
              "use std::cell::Cell;\n",
              "use std::cell::Cell;\n"
              "use std::collections::HashMap;\n"
              "use std::env;\n",
              "imports"
          )

          s = replace_once(
              s,
              "use serde::{Deserialize, Serialize};\n",
              "use serde::{Deserialize, Serialize};\n"
              "use serde_json::{json, Value};\n",
              "serde imports"
          )

          s = replace_once(
              s,
              "should_reload: Cell<bool>,\n",
              "should_reload: Cell<bool>,\n"
              "ai_history: HashMap<String, Vec<(String, String)>>,\n",
              "Bot history field"
          )

          s = replace_once(
              s,
              "should_reload: Default::default(),\n",
              "should_reload: Default::default(),\n"
              "ai_history: Default::default(),\n",
              "Bot history initialization"
          )

          start = s.index("fn handle_event(")
          end = s.index("\nfn escape_bb", start)

          new_function = r'''
          fn handle_event(bot: &mut Bot, con: &mut Connection, event: &[Event]) {
              for e in event {
                  if let Event::Message { target, invoker, message } = e {

                      debug!(
                          user_id = ?invoker.id,
                          message_chars = message.to_string().chars().count(),
                          "Incoming TeaSpeak message"
                      );

                      if invoker.id == con.get_state().unwrap().own_client {
                          continue;
                      }

                      {
                          let rate = &mut bot.rate_limiting;
                          let now = Instant::now();
                          let second = Duration::from_secs(1);
                          rate.retain(|i| now.duration_since(*i) <= second);

                          if rate.len() >= bot.settings.rate_limit as usize {
                              debug!("Message skipped by rate limit");
                              continue;
                          }
                      }

                      let msg = Message {
                          target: *target,
                          invoker: invoker.as_ref(),
                          message,
                      };

                      // Existing commands and actions always have priority.
                      if let Some(response) = bot.actions.handle(bot, con, &msg) {
                          debug!("Existing action handled the message");

                          bot.rate_limiting.push(Instant::now());

                          let state = con.get_state().unwrap();

                          let reply_target = match target {
                              MessageTarget::Client(_) => MessageTarget::Client(invoker.id),
                              _ => *target,
                          };

                          if let Err(error) =
                              state.send_message(reply_target, response.as_ref()).send(con)
                          {
                              error!(%error, "Failed to send action response");
                          }

                          continue;
                      }

                      // Read API key without logging its value.
                      let api_key = match env::var("GEMINI_API_KEY") {
                          Ok(key) if !key.trim().is_empty() => {
                              info!("GEMINI_API_KEY is configured");
                              key
                          },
                          _ => {
                              warn!("GEMINI_API_KEY is missing or empty; Gemini skipped");
                              continue;
                          },
                      };

                      let history_key = format!("{:?}", invoker.id);

                      let history = bot.ai_history
                          .get(&history_key)
                          .cloned()
                          .unwrap_or_default();

                      let user_text = message.to_string();

                      info!(
                          user_id = ?invoker.id,
                          "Sending message to Gemini"
                      );

                      // Run blocking HTTP work on a separate thread.
                      let result = std::thread::spawn(move || {
                          gemini_reply(&api_key, &history, &user_text)
                      }).join();

                      match result {
                          Ok(Ok(answer)) => {
                              info!(
                                  user_id = ?invoker.id,
                                  answer_chars = answer.chars().count(),
                                  "Gemini returned a response"
                              );

                              let entry = bot.ai_history
                                  .entry(history_key)
                                  .or_default();

                              entry.push((message.to_string(), answer.clone()));

                              // Keep latest six exchanges per user.
                              if entry.len() > 6 {
                                  entry.remove(0);
                              }

                              bot.rate_limiting.push(Instant::now());

                              let safe_answer = escape_bb(&answer);

                              let reply_target = match target {
                                  MessageTarget::Client(_) | MessageTarget::Poke(_) =>
                                      MessageTarget::Client(invoker.id),
                                  _ => *target,
                              };

                              let state = con.get_state().unwrap();

                              info!(
                                  user_id = ?invoker.id,
                                  "Sending Gemini response to TeaSpeak"
                              );

                              if let Err(error) =
                                  state.send_message(reply_target, safe_answer.as_str()).send(con)
                              {
                                  error!(%error, "Failed to send Gemini response");
                              } else {
                                  info!(
                                      user_id = ?invoker.id,
                                      "Gemini response successfully sent"
                                  );
                              }
                          }

                          Ok(Err(error)) => {
                              error!(
                                  user_id = ?invoker.id,
                                  %error,
                                  "Gemini API request failed"
                              );
                          }

                          Err(_) => {
                              error!("Gemini worker thread failed");
                          }
                      }
                  }
              }
          }

          fn gemini_reply(
              api_key: &str,
              history: &[(String, String)],
              user_message: &str,
          ) -> Result<String> {

              let client = reqwest::blocking::Client::builder()
                  .timeout(Duration::from_secs(25))
                  .build()?;

              let mut contents = Vec::new();

              for (user, assistant) in history {
                  contents.push(json!({
                      "role": "user",
                      "parts": [{"text": user}]
                  }));

                  contents.push(json!({
                      "role": "model",
                      "parts": [{"text": assistant}]
                  }));
              }

              contents.push(json!({
                  "role": "user",
                  "parts": [{"text": user_message}]
              }));

              let body = json!({
                  "system_instruction": {
                      "parts": [{
                          "text": "تو علی‌بات هستی؛ یک دستیار فارسی‌زبان خودمانی، باهوش، خوش‌برخورد و کمی شوخ‌طبع. طبیعی و کوتاه جواب بده، مثل یک انسان در چت. از ایموجی به اندازه استفاده کن. اگر جواب چیزی را نمی‌دانی، صادقانه بگو و حدس را به جای واقعیت جا نزن. به زبان کاربر پاسخ بده و از توضیح اضافه پرهیز کن."
                      }]
                  },
                  "contents": contents,
                  "generationConfig": {
                      "maxOutputTokens": 220
                  }
              });

              let http_response = client
                  .post("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent")
                  .header("x-goog-api-key", api_key)
                  .json(&body)
                  .send()?;

              let status = http_response.status();
              let response_text = http_response.text()?;

              if !status.is_success() {
                  let detail = response_text
                      .chars()
                      .take(1200)
                      .collect::<String>();

                  anyhow::bail!(
                      "Gemini HTTP {}: {}",
                      status,
                      detail
                  );
              }

              let response: Value = serde_json::from_str(&response_text)?;

              let parts = response["candidates"][0]["content"]["parts"]
                  .as_array()
                  .ok_or_else(|| {
                      anyhow::anyhow!(
                          "Gemini returned no text candidate. Response: {}",
                          response_text.chars().take(800).collect::<String>()
                      )
                  })?;

              let answer = parts.iter()
                  .filter_map(|part| {
                      part.get("text").and_then(Value::as_str)
                  })
                  .collect::<Vec<_>>()
                  .join("");

              let answer = answer.trim();

              if answer.is_empty() {
                  anyhow::bail!("Gemini returned an empty response");
              }

              Ok(answer.chars().take(650).collect())
          }
          '''

          s = s[:start] + new_function + s[end:]
          p.write_text(s)

          print("Gemini AI with diagnostics installed successfully.")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate dependency lockfile
        working-directory: simplebot-src
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Compile
        working-directory: simplebot-src
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simple-bot-linux-x86_64
          path: simplebot-src/target/release/simple-bot
          if-no-files-found: error
          retention-days: 7

      - name: Publish binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SimpleBot
          files: simplebot-src/target/release/simple-bot
          overwrite_files: true
          make_latest: true
