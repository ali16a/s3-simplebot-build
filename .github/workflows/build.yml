
name: Build SimpleBot Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl

      - name: Download SimpleBot source
        uses: actions/checkout@v4
        with:
          repository: ReSpeak/SimpleBot
          path: simplebot-src

      - name: Enable vendored OpenSSL
        working-directory: simplebot-src
        run: |
          echo 'openssl-sys = { version = "0.9", features = ["vendored"] }' >> Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update incompatible time dependency
        working-directory: simplebot-src
        run: cargo update -p time --precise 0.3.36

      - name: Set identity security level
        working-directory: simplebot-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          old = "let identity = Identity::new(private_key, 0);"
          new = "let mut identity = Identity::new(private_key, 0);\n\tidentity.upgrade_level(8);"
          assert old in s, "Identity line not found"
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Compile
        working-directory: simplebot-src
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simple-bot-linux-x86_64
          path: simplebot-src/target/release/simple-bot
          if-no-files-found: error
          retention-days: 7

      - name: Publish binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SimpleBot
          files: simplebot-src/target/release/simple-bot
          overwrite_files: true
          make_latest: true
